<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Lab - LabTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root{
        --navy: #14213D;
        --navy-2: #1C2E52;
        --amber: #FCA311;
        --amber-dim: #FCA31133;
        --bg: #F5F6F8;
        --text-dim: #8A93A8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; }
    .topbar {
        background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
        color: white; padding: 18px 32px;
        display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; }
    .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px var(--amber-dim); }
    .back-link { color: var(--amber); text-decoration: none; font-size: 13px; font-weight: 600; }

    .wrap { max-width: 560px; margin: 50px auto; padding: 0 20px; }
    .card {
        background: white; border-radius: 12px;
        box-shadow: 0 10px 24px rgba(20,33,61,0.08);
        padding: 32px; border-top: 3px solid var(--amber);
    }
    .card h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: var(--navy); margin: 0 0 24px; }
    label {
        display: block; font-size: 12px; font-weight: 600; color: var(--navy);
        margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;
    }
    input, textarea {
        width: 100%; padding: 11px 13px; border: 1.5px solid #E3E6ED; border-radius: 8px;
        font-family: 'Inter', sans-serif; font-size: 14px; color: var(--navy);
        margin-bottom: 18px; resize: vertical;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--amber); }
    button {
        width: 100%; background: var(--navy); color: var(--amber); border: none;
        padding: 13px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    button:hover { background: var(--navy-2); }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="brand-dot"></span>LABTRACK</div>
    <a href="/manage-labs" class="back-link">&larr; Back to manage labs</a>
</div>

<div class="wrap">
    <div class="card">
        <h1>Edit Lab</h1>
        <form method="POST" action="/edit-lab/{{ lab.id }}">
            <label>Lab Title</label>
            <input type="text" name="title" value="{{ lab.title }}" required>

            <label>Description</label>
            <textarea name="description" rows="4">{{ lab.description }}</textarea>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</div>

</body>
</html>
