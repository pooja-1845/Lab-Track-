<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Labs - LabTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root{
        --navy: #14213D;
        --navy-2: #1C2E52;
        --amber: #FCA311;
        --amber-dim: #FCA31133;
        --bg: #F5F6F8;
        --text-dim: #8A93A8;
        --red: #E5484D;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; }
    .topbar {
        background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
        color: white; padding: 18px 32px;
        display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; }
    .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px var(--amber-dim); }
    .back-link { color: var(--amber); text-decoration: none; font-size: 13px; font-weight: 600; }

    .hero {
        background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
        color: white; padding: 0 32px 56px; position: relative; overflow: hidden;
    }
    .hero::before {
        content: ""; position: absolute; top: -80px; right: -80px;
        width: 260px; height: 260px; border: 1px solid rgba(255,255,255,0.07); border-radius: 50%;
    }
    .hero-inner { max-width: 860px; margin: 0 auto; padding-top: 30px; position: relative; z-index: 1; }
    .hero-inner h1 { font-family: 'Space Grotesk', sans-serif; font-size: 26px; margin: 0 0 6px; }
    .hero-inner p { color: #AEB7CC; font-size: 14px; margin: 0; }

    .wrap { max-width: 860px; margin: -30px auto 50px; padding: 0 20px; position: relative; z-index: 2; }

    .lab-card {
        background: white; border-radius: 12px;
        box-shadow: 0 10px 22px rgba(20,33,61,0.09);
        padding: 20px 24px; margin-bottom: 14px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap;
        border-left: 3px solid var(--amber);
    }
    .lab-info b { color: var(--navy); font-size: 15px; }
    .lab-info .desc { color: var(--text-dim); font-size: 13px; margin-top: 4px; max-width: 480px; }

    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
        border: none; padding: 9px 16px; border-radius: 8px;
        font-weight: 700; font-size: 13px; cursor: pointer;
        display: flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn-edit { background: var(--navy); color: var(--amber); }
    .btn-edit:hover { background: var(--navy-2); }
    .btn-view { background: var(--amber); color: var(--navy); }
    .btn-view:hover { background: #e6940c; }
    .btn-delete { background: #FFEAEA; color: var(--red); }
    .btn-delete:hover { background: #FFDADA; }

    .empty-state {
        text-align: center; background: white; border-radius: 14px;
        padding: 60px 20px; box-shadow: 0 10px 22px rgba(20,33,61,0.07); color: var(--text-dim);
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="brand-dot"></span>LABTRACK</div>
    <a href="/teacher-dashboard" class="back-link">&larr; Back to dashboard</a>
</div>

<div class="hero">
    <div class="hero-inner">
        <h1>Manage Labs</h1>
        <p>Edit or remove labs you've created.</p>
    </div>
</div>

<div class="wrap">
    {% if labs %}
        {% for lab in labs %}
        <div class="lab-card">
            <div class="lab-info">
                <b>{{ lab.title }}</b>
                <div class="desc">{{ lab.description }}</div>
            </div>
            <div class="actions">
                <a href="/edit-lab/{{ lab.id }}" class="btn btn-edit">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Edit
                </a>

                <a href="{{ url_for('view_submissions', lab_id=lab.id) }}" class="btn btn-view">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    View Submissions
                </a>

                <form method="POST" action="/delete-lab/{{ lab.id }}" onsubmit="return confirm('Delete this lab and all its submissions?');">
                    <button type="submit" class="btn btn-delete">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                        Delete
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="empty-state">No labs created yet.</div>
    {% endif %}
</div>

</body>
</html>
